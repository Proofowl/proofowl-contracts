name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is caught even without a
    # commit. Monday 04:17 UTC. Also drives the resource-profile job
    # below, which is too slow/noisy to run on every push or PR.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

# GitHub Actions below are pinned to major version tags. Moving to full
# commit-SHA pins is a tracked hardening task (see docs/MAINTAINERS.md /
# PRODUCTION_READINESS.md) that needs a maintainer with network access to
# verify each SHA against the upstream action repository.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # soroban-sdk 27 requires Rust >= 1.84 and the wasm32v1-none
        # target; wasm32-unknown-unknown is unsupported on Rust >= 1.82.
        uses: dtolnay/rust-toolchain@1.84
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Build the wasm BEFORE the tests: tests/constructor_auth.rs deploys
      # the compiled artifact through the real deployer/auth path and
      # skips itself if the wasm is absent.
      - name: Build wasm (release)
        run: cargo build --target wasm32v1-none --release

      - name: Test
        run: cargo test --all

      # Named explicitly (a subset of the `cargo test --all` run just
      # above, so this is not weakening or replacing it) so the
      # adversarial/security suite's pass/fail shows as its own step in
      # the CI log for anyone reviewing a run, per the Phase 4 mandate
      # to make this coverage visible in CI, not just present in the
      # tree. Mirrors `make security-test`.
      - name: Adversarial and security test suite
        run: cargo test --test security_matrix --test state_machine --test ttl_replay --test boundary_and_events --test sdk_vectors

      # v0.2 structural regression guard (docs/adr/0004-paginated-attestation-storage.md):
      # fails fast, statically, if a future change reintroduces v0.1's
      # unbounded per-wallet attestation storage or drops the page-size
      # bound that fixed it. Mirrors `make check-bounded-storage`.
      - name: Bounded attestation storage guard
        run: bash scripts/check_bounded_storage.sh

  # ---- Resource / scalability profile ---------------------------------
  # Diagnostic, not a correctness gate: measures cost growth and the
  # hard per-wallet history ceiling (docs/security/resource-profile-v1.md).
  # Deploys the real WASM and runs `#[ignore]`d tests, which takes
  # meaningfully longer than the rest of the suite and produces evidence
  # for a document rather than a pass/fail security requirement, so it
  # is kept off the default push/PR path and run on the same weekly
  # schedule as the supply-chain advisory check, plus on-demand via
  # workflow_dispatch. Mirrors `make resource-profile`.
  resource-profile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.84
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resource profile
        run: make resource-profile

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.84

      # cargo-deny / cargo-audit are pinned by exact version and cached by
      # that version key, so CI stays reproducible and fast. Bump the
      # versions here, in the Makefile, and re-validate deny.toml together.
      - name: Cache supply-chain tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: supply-chain-tools-${{ runner.os }}-cargo-deny-0.20.2-cargo-audit-0.22.2

      - name: Install cargo-deny and cargo-audit
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit

      # Deterministic given Cargo.lock: bans, licenses, sources. Plus the
      # advisories check (network — RustSec DB); a single documented
      # exception lives in deny.toml.
      - name: cargo-deny
        run: cargo deny check

      # Secondary scan. Same documented exception as deny.toml.
      - name: cargo-audit
        run: cargo audit --ignore RUSTSEC-2024-0436

  # ---- TypeScript integration SDK (sdk/typescript/) -------------------
  # Independent of the Rust gates above. Node-only, fast: install from the
  # committed lockfile, then format / lint / type-check / unit-test.
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install deps (locked)
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # ---- Generated-binding drift check --------------------------------
  # Rebuilds the WASM, regenerates the TypeScript bindings with the same
  # pinned Stellar CLI, and fails if src/generated/ differs from what is
  # committed. Heavier (needs Rust + the CLI) so it is its own job.
  sdk-bindings-drift:
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: "28.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.84
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Stellar CLI
        id: cache-stellar
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI (pinned, prebuilt)
        if: steps.cache-stellar.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin" stellar
          chmod +x "$HOME/.local/bin/stellar"

      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build contract WASM
        run: cargo build --target wasm32v1-none --release

      - name: Regenerate bindings
        run: npm run generate
        working-directory: sdk/typescript

      - name: Fail on drift
        run: |
          git diff --exit-code -- sdk/typescript/src/generated \
            || { echo "::error::generated bindings are stale — run 'make sdk-generate' and commit"; exit 1; }
