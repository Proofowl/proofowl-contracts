[package]
name = "proofowl-contracts"
version = "0.2.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "ProofOwl on-chain reputation registry — Soroban contract"
repository = "https://github.com/proofowl/proofowl-contracts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.4"

[dev-dependencies]
soroban-sdk = { version = "27.0.4", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
